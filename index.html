<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="模型库">

<title>个人模型库｜Mental Models OS</title>
<style>
:root {
  --bg:#f6f7f9; --panel:#ffffff; --text:#111827; --muted:#6b7280;
  --line:#e5e7eb; --accent:#111827; --soft:#f3f4f6;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px}
.top{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:14px}
input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;outline:none}
input:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
button,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;cursor:pointer}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{font-size:13px;color:var(--muted);margin-top:10px}
main{max-width:1120px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.badge{display:inline-block;font-size:12px;color:#374151;background:var(--soft);padding:4px 8px;border-radius:999px;margin-bottom:10px}
.title{font-weight:700;font-size:18px;margin-bottom:10px}
.core{font-size:16px;line-height:1.65;padding:12px;background:#fafafa;border-left:3px solid #111827;border-radius:8px;margin-bottom:12px}
.row{margin-top:10px;line-height:1.65;font-size:14px}
.label{font-weight:700;margin-right:5px}
.related{color:#374151}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{max-width:1120px;margin:0 auto;padding:20px 18px 36px;color:var(--muted);font-size:12px}
@media (max-width:640px){
  .wrap,main{padding-left:12px;padding-right:12px}
  h1{font-size:21px}
  .grid{grid-template-columns:1fr}
  .card{padding:14px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>个人模型库｜Mental Models OS</h1>
        <div class="sub">用于检索、调用、反证与行动验证</div>
      </div>
    </div>
    <div class="tools">
      <input id="q" placeholder="搜索模型名、触发条件、行动指令、关键词…" autocomplete="off">
      <button id="clear">清空</button>
    </div>
    <div id="chips" class="tools"></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">没有找到匹配的模型。</div>
</main>

<footer>
  使用建议：遇到问题时先搜索关键词，再选 1–3 个模型组合调用；不要把模型当成永久真理。
</footer>

", "action": "设计合理、真实的价值参照，而不是只给孤立价格。", "boundary": "锚点过度夸张会破坏信任。", "related": "价格弹性、用户心理。", "case": ""}, {"id": "M015", "name": "20%测试原则", "section": "实验、增长与系统", "section_code": "C", "core": "不要大改，先用 20% 的资源探索边界。", "trigger": "方案存在不确定性且可以分流验证。", "logic": "小成本试验能换取高价值信息，同时控制下行风险。", "action": "保留 80% 稳定盘，拿 20% 测新方案；只有证据变强才扩大。", "boundary": "样本过小时不能机械使用 20%。", "related": "贝叶斯、A/B测试、快速试错。", "case": ""}, {"id": "M016", "name": "A/B 测试", "section": "实验、增长与系统", "section_code": "C", "core": "一次尽量只改变一个关键变量。", "trigger": "主图、标题、页面、自动化路径、投放方式比较。", "logic": "控制变量才能提高因果判断可信度。", "action": "定义指标 → 建立对照 → 改一个变量 → 观察足够样本 → 决定保留/回滚。", "boundary": "流量、时间、活动环境差异过大时结果不可直接归因。", "related": "20%测试、贝叶斯、数据闭环。", "case": ""}, {"id": "M017", "name": "快速试错", "section": "实验、增长与系统", "section_code": "C", "core": "失败不可怕，昂贵、缓慢、不可学习的失败才可怕。", "trigger": "新产品、新流程、新自动化。", "logic": "早暴露错误能降低后期修复成本。", "action": "缩小试验规模、缩短反馈周期、保留检查点。", "boundary": "高风险不可逆场景要先提高验证门槛。", "related": "A/B测试、20%测试、复盘迭代。", "case": ""}, {"id": "M018", "name": "数据闭环", "section": "实验、增长与系统", "section_code": "C", "core": "数据的价值不在“看”，而在“改变下一步动作”。", "trigger": "报表、周报、推广数据、客服指标。", "logic": "没有动作反馈的数据只是信息存储。", "action": "每个指标必须对应“继续 / 观察 / 调整 / 停止”的动作规则。", "boundary": "不要为了可量化而忽略关键质性因素。", "related": "贝叶斯、复盘迭代、经营安全线。", "case": ""}, {"id": "M019", "name": "复盘迭代", "section": "实验、增长与系统", "section_code": "C", "core": "复盘不是总结发生了什么，而是更新下一次决策规则。", "trigger": "一次投放、发品、自动化、项目结束后。", "logic": "经验只有被提炼成规则才可复用。", "action": "发生了什么 → 哪里异常 → 我做了什么 → 是否改善 → 下次继续/观察/回滚。", "boundary": "不要对随机波动过度归因。", "related": "数据闭环、根因分析、贝叶斯。", "case": ""}, {"id": "M020", "name": "反馈循环", "section": "实验、增长与系统", "section_code": "C", "core": "系统会因自身结果反过来改变未来状态。", "trigger": "流量、评价、销量、投放、团队绩效等连续系统。", "logic": "正反馈放大趋势，负反馈抑制偏离。", "action": "识别“哪个结果会反过来强化/削弱原因”。", "boundary": "不是所有相关变化都是反馈环。", "related": "系统优化、网络效应、复利。", "case": ""}, {"id": "M021", "name": "复利", "section": "实验、增长与系统", "section_code": "C", "core": "可重复的小优势，经过时间会产生非线性差距。", "trigger": "技能、资产、流程、内容、客户关系。", "logic": "收益继续进入下一轮增长基数。", "action": "优先建立可持续、可重复、能积累的能力和资产。", "boundary": "负反馈和路径失效也会“负复利”。", "related": "长期价值、系统优化。", "case": ""}, {"id": "M022", "name": "杠杆 / 优化杠杆", "section": "实验、增长与系统", "section_code": "C", "core": "找到少数能影响大量结果的变量。", "trigger": "资源不足、问题复杂、指标很多。", "logic": "变量影响力并不平均。", "action": "先找“改变 1 个变量，能同时影响哪些下游结果”。", "boundary": "所谓杠杆必须用数据验证，不能只凭想象。", "related": "80/20、漏斗、根因分析。", "case": ""}, {"id": "M023", "name": "边际效用递减", "section": "实验、增长与系统", "section_code": "C", "core": "同一资源持续追加，新增收益通常会逐渐下降。", "trigger": "预算加码、促销、学习时间、广告频次。", "logic": "最有效机会通常先被消耗。", "action": "观察“再投入 1 单位资源还能新增多少收益”。", "boundary": "网络效应、临界规模等场景可能出现阶段性递增。", "related": "边际收益/成本、机会成本。", "case": ""}, {"id": "M024", "name": "边际收益 / 成本", "section": "实验、增长与系统", "section_code": "C", "core": "是否继续投入，看下一单位投入，而不是历史平均值。", "trigger": "是否继续加预算、加人、加时间。", "logic": "历史投入是沉没成本；未来决策看新增收益和新增成本。", "action": "计算“下一块钱 / 下一小时”的增量回报。", "boundary": "长期战略投入不能只看短期边际收益。", "related": "机会成本、边际效用递减。", "case": ""}, {"id": "M025", "name": "网络效应", "section": "实验、增长与系统", "section_code": "C", "core": "某些系统中，参与者越多，系统对每个参与者越有价值。", "trigger": "平台、社区、生态、用户互动。", "logic": "新增节点提高连接数量和价值。", "action": "判断增长是否会让产品本身更有价值，而不仅是规模更大。", "boundary": "拥堵、低质量用户可能产生负网络效应。", "related": "反馈循环、复利。", "case": ""}, {"id": "M026", "name": "自然选择 / 适应", "section": "实验、增长与系统", "section_code": "C", "core": "长期留下来的方案，不一定最优，但通常更适应当前环境。", "trigger": "平台规则变化、竞争、行业演化。", "logic": "环境筛选适应者。", "action": "把策略看成“可迭代的变异”，保留有效者，淘汰失效者。", "boundary": "历史存活不等于未来仍有效。", "related": "快速试错、系统优化。", "case": ""}, {"id": "M027", "name": "西蒙学习法", "section": "学习模型", "section_code": "D", "core": "先搭地图，再学细节；先抓关键关系，再补知识点。", "trigger": "进入陌生行业、陌生学科、复杂主题。", "logic": "有限理性下，结构化“组块”比零散知识更易理解和调用。", "action": "拆模块 → 找关键 20% → 建关系 → 再补局部细节。", "boundary": "地图只是起点，不能代替深入训练。", "related": "费曼、多学科思维、价值优先。", "case": ""}, {"id": "M028", "name": "费曼学习法", "section": "学习模型", "section_code": "D", "core": "能用外行能懂的话讲清楚，才算真正理解。", "trigger": "觉得“好像懂了”，但不能解释或应用。", "logic": "复述会暴露概念空洞、因果断点和术语依赖。", "action": "关资料 → 白话解释 → 找卡点 → 定点补洞 → 再解释。", "boundary": "简化不能扭曲关键机制。", "related": "西蒙、主动提取、系统2。", "case": ""}, {"id": "M029", "name": "西蒙 × 费曼 × 系统2闭环", "section": "学习模型", "section_code": "D", "core": "先搭地图，再白话复述，再反证，最后用行动验证。", "trigger": "学习新概念、行业拆解、形成长期方法论。", "logic": "结构、理解、纠错、现实反馈缺一不可。", "action": "西蒙搭地图 → 找关键关系 → 费曼复述 → 定点补洞 → 系统2反证 → 行动验证更新。", "boundary": "不要把流程做成形式主义。", "related": "贝叶斯、价值优先。", "case": ""}, {"id": "M030", "name": "主动提取", "section": "学习模型", "section_code": "D", "core": "真正强化记忆的是“从脑中取出来”，不是重复看进去。", "trigger": "记忆单词、概念、流程。", "logic": "提取练习会强化记忆路径。", "action": "看完关闭资料，主动回忆、输出、测试。", "boundary": "完全没有初始输入时无法直接提取。", "related": "间隔重复、费曼。", "case": ""}, {"id": "M031", "name": "间隔提取", "section": "学习模型", "section_code": "D", "core": "快忘的时候再提取，比集中重复更有效。", "trigger": "需要长期记忆。", "logic": "适度遗忘后成功提取能增强记忆。", "action": "采用 0 / 1 / 3 / 7 天等节奏复习，重点处理错项。", "boundary": "复习间隔要随难度调整。", "related": "主动提取、复利。", "case": ""}, {"id": "M032", "name": "多学科思维", "section": "学习模型", "section_code": "D", "core": "复杂现实不能只用一个学科解释。", "trigger": "商业、投资、组织、人性等复杂问题。", "logic": "单一模型会形成盲区；多个独立模型能交叉校验。", "action": "至少从数据、心理、经济、系统四个角度检查重要问题。", "boundary": "模型越多不代表越好，必须与问题相关。", "related": "系统2、贝叶斯。", "case": ""}, {"id": "M033", "name": "漏斗模型", "section": "商业 / 电商经营", "section_code": "E", "core": "结果差，要先定位掉在哪一层，而不是整体优化。", "trigger": "曝光 → 点击 → 转化 → 复购等链路。", "logic": "不同环节由不同变量决定。", "action": "找最低效环节 → 只优化该层关键变量 → 再观察下游。", "boundary": "环节之间会相互影响，不能完全孤立。", "related": "根因分析、杠杆、数据闭环。", "case": ""}, {"id": "M034", "name": "价格弹性", "section": "商业 / 电商经营", "section_code": "E", "core": "价格变化对销量的影响因品类和人群而异。", "trigger": "调价、促销、利润率与销量权衡。", "logic": "不同商品需求对价格敏感度不同。", "action": "用小幅分段测试判断价格—销量—利润的关系。", "boundary": "不能只看销量，要看利润和用户结构。", "related": "心理锚定、20%测试、边际收益。", "case": ""}, {"id": "M035", "name": "经营安全线", "section": "商业 / 电商经营", "section_code": "E", "core": "广告不是越能成交越好，要判断它是在创造增量，还是吞掉自然成交。", "trigger": "投放费比、营销占比、自然成交变化。", "logic": "推广成交可能替代自然成交，导致账面投放有效但整体利润恶化。", "action": "同时看推广消耗、推广成交、总成交、自然成交和营销占比趋势。", "boundary": "阈值必须按品类、利润和阶段校准。", "related": "数据闭环、增量思维、边际收益。", "case": ""}, {"id": "M036", "name": "广告增量 vs 自然替代", "section": "商业 / 电商经营", "section_code": "E", "core": "判断广告价值的关键，不是“广告出了多少单”，而是“总盘因此多了多少单”。", "trigger": "广告成交上涨，但总成交未同步上涨。", "logic": "广告可能抢走原本会自然成交的订单。", "action": "比较广告增量和总成交增量，识别“真放量”还是“流量搬家”。", "boundary": "需要较稳定的对照周期。", "related": "经营安全线、成交守恒率。", "case": ""}, {"id": "M037", "name": "成交守恒率", "section": "商业 / 电商经营", "section_code": "E", "core": "推广变化是否真正转化为总成交变化，要看增量是否“守恒”。", "trigger": "推广花费、推广成交变化明显。", "logic": "若推广成交大涨但总成交不涨，可能只是替代自然流量。", "action": "把推广成交变化与总成交变化联动分析。", "boundary": "活动、季节、库存等外部变量会干扰。", "related": "广告增量、放量效率。", "case": ""}, {"id": "M038", "name": "放量效率", "section": "商业 / 电商经营", "section_code": "E", "core": "真正有效的放量，是消耗增长带来的成交增长更快或至少可接受。", "trigger": "扩大广告预算。", "logic": "花费上涨不等于增长，关键是成交增量相对消耗增量。", "action": "同时比较消耗涨幅、成交涨幅、CPA/费比变化。", "boundary": "起盘期可允许短期效率波动。", "related": "边际收益、数据闭环。", "case": ""}, {"id": "M039", "name": "费比改善质量", "section": "商业 / 电商经营", "section_code": "E", "core": "费比下降不一定是好事，要看是效率提升还是缩量导致。", "trigger": "费比突然改善。", "logic": "消耗下降快于成交下降也会让费比“变漂亮”。", "action": "把费比变化与消耗、成交金额、CPA、自然成交一起看。", "boundary": "单指标结论不可信。", "related": "成交守恒率、放量效率。", "case": ""}, {"id": "M040", "name": "接受型变量", "section": "商业 / 电商经营", "section_code": "E", "core": "不可控变量要接受和适配，不要误当成可优化对象。", "trigger": "平台活动、官方立减、跨店满减、平台券、季节周期。", "logic": "把不可控变量当优化目标会浪费资源。", "action": "先区分“可控 / 可影响 / 只能接受”，只在前两类投入优化资源。", "boundary": "不可控不等于不可提前准备。", "related": "机会成本、系统优化。", "case": ""}, {"id": "M041", "name": "关键词推广：精准点击 × 稳定成交", "section": "商业 / 电商经营", "section_code": "E", "core": "关键词推广的核心不是买流量，而是买“精准且能稳定成交”的流量。", "trigger": "关键词推广诊断。", "logic": "点击成本低但人群不准，仍会导致 CPA 失控。", "action": "先判断点击是否精准，再判断成交是否稳定。", "boundary": "不同客单价、阶段、品类需分别校准。", "related": "漏斗、CPA、贝叶斯。", "case": ""}, {"id": "M042", "name": "全站推：扩量效率", "section": "商业 / 电商经营", "section_code": "E", "core": "全站推的核心问题是“多花的钱有没有换来有效增量”。", "trigger": "全站推放量。", "logic": "全域分发更容易放大强品，也更容易吞预算。", "action": "看增量成交、边际 CPA、自然成交变化，而不是只看消耗。", "boundary": "新品冷启动和稳定期评价尺度不同。", "related": "放量效率、经营安全线。", "case": ""}, {"id": "M043", "name": "复制机制，而不是复制作品", "section": "自动化与流程", "section_code": "F", "core": "真正可复用的是成功机制，不是某一次输出的表面形式。", "trigger": "Skill、自动化、发品流程、图片方法迁移。", "logic": "场景会变，但关键机制和决策规则更稳定。", "action": "记录“为什么成功、关键步骤、触发条件、失败恢复”，而不是只保存结果。", "boundary": "领域特有规则仍需单独重建。", "related": "复盘迭代、系统优化。", "case": ""}, {"id": "M044", "name": "稳定系统优先", "section": "自动化与流程", "section_code": "F", "core": "已经稳定工作的系统，不要为了“更先进”而重构。", "trigger": "已有自动化已经稳定，新工具出现。", "logic": "重构会引入新的未知故障面。", "action": "保留稳定路径，只对真实瓶颈做小范围替换测试。", "boundary": "如果旧系统已出现结构性限制，则需要重构。", "related": "20%测试、机会成本。", "case": ""}, {"id": "M045", "name": "自动化的目标是可恢复，不是永不失败", "section": "自动化与流程", "section_code": "F", "core": "可靠自动化的核心，是失败后能识别、定位、恢复。", "trigger": "浏览器自动化、后台发品、数据下载。", "logic": "复杂界面不可避免会出现延迟、DOM变化、网络异常。", "action": "保留检查点、状态记录、断点续跑、明确失败原因。", "boundary": "高频重复故障仍需修根因。", "related": "根因分析、快速试错、复盘迭代。", "case": ""}, {"id": "M046", "name": "故障诊断闭环", "section": "自动化与流程", "section_code": "F", "core": "观察失败节点 → 找具体原因 → 定向修复 → 重跑 → 保存成功路径。", "trigger": "自动化断点、iframe、懒加载、点击失败。", "logic": "错误必须定位到具体环节才能稳定修复。", "action": "区分“元素不存在 / 未加载 / 定位失败 / 点击失败 / 必填项未完成”。", "boundary": "不要一次同时改多个路径，否则无法知道哪项修复有效。", "related": "根因分析、A/B测试、复盘迭代。", "case": ""}, {"id": "M047", "name": "红绿灯管理", "section": "组织与绩效", "section_code": "G", "core": "复杂绩效先转成“正常 / 观察 / 风险”三个状态。", "trigger": "多店铺、多指标客服绩效。", "logic": "管理的第一目标是快速定位问题，而不是制造复杂分数。", "action": "绿灯正常；黄灯持续跟踪；红灯立即定位原因和处理。", "boundary": "红绿灯是管理入口，不应替代原始指标。", "related": "数据闭环、异常管理。", "case": ""}, {"id": "M048", "name": "能力分 × 工作量分离", "section": "组织与绩效", "section_code": "G", "core": "服务质量和工作量要分开计量，避免“做得多”掩盖“做得差”。", "trigger": "多店铺客服绩效。", "logic": "工作量和质量是两个不同维度。", "action": "能力分决定质量，工作量只作为独立加成。", "boundary": "不能让工作量系数无限放大。", "related": "加权平均、指标设计。", "case": ""}, {"id": "M049", "name": "加权平均", "section": "组织与绩效", "section_code": "G", "core": "多店合并指标不能简单平均，要按真实业务量加权。", "trigger": "跨店响应时长、处理时长、绩效汇总。", "logic": "店铺业务量不同，简单平均会扭曲结果。", "action": "优先用户级数据；无用户级数据时按订单量/会话量加权。", "boundary": "权重选择必须与指标因果相关。", "related": "数据质量、系统2。", "case": ""}, {"id": "M050", "name": "基本面 ≠ 买入信号", "section": "投资与风险管理", "section_code": "H", "core": "长期看好，不等于现在就是好的加仓点。", "trigger": "AI、半导体、指数长期逻辑仍在，但短期波动剧烈。", "logic": "方向判断和时点判断是两个问题。", "action": "把“是否长期持有”和“是否现在加仓”分开决策。", "boundary": "长期定投策略本身可弱化择时权重。", "related": "概率、风险预算、贝叶斯。", "case": ""}, {"id": "M051", "name": "跌幅不是加仓充分条件", "section": "投资与风险管理", "section_code": "H", "core": "便宜了不等于值得买，先判断为什么跌。", "trigger": "资产出现明显回撤。", "logic": "情绪性下跌与逻辑恶化的含义完全不同。", "action": "先区分情绪下跌 / 基本面恶化，再决定是否加仓。", "boundary": "底部无法精确识别，仍需分批。", "related": "贝叶斯、安全边际。", "case": ""}, {"id": "M052", "name": "仓位与预算分离", "section": "投资与风险管理", "section_code": "H", "core": "市值变化不等于新增投入，资产暴露和现金预算必须分开记账。", "trigger": "基金持仓更新、涨跌后仓位判断。", "logic": "市值受市场波动影响，不能反推申购金额。", "action": "分别维护“当前市值 / 累计申购 / 剩余预算”。", "boundary": "转换、分红、赎回必须单独记账。", "related": "数据质量、风险预算。", "case": ""}];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const chips = document.getElementById('chips');
const stats = document.getElementById('stats');
const empty = document.getElementById('empty');
let activeSection = '全部';

const sections = ['全部', ...Array.from(new Set(models.map(x => x.section)))];

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderChips() {
  chips.innerHTML = sections.map(s => `<span class="chip ${s===activeSection?'active':''}" data-s="${esc(s)}">${esc(s)}</span>`).join('');
  chips.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    activeSection = el.dataset.s;
    renderChips(); render();
  });
}

function render() {
  const kw = q.value.trim().toLowerCase();
  const filtered = models.filter(m => {
    const inSection = activeSection === '全部' || m.section === activeSection;
    const hay = Object.values(m).join(' ').toLowerCase();
    return inSection && (!kw || hay.includes(kw));
  });
  stats.textContent = `共 ${models.length} 张模型卡 · 当前显示 ${filtered.length} 张`;
  empty.style.display = filtered.length ? 'none' : 'block';
  grid.innerHTML = filtered.map(m => `
    <article class="card">
      <div class="badge">${esc(m.id)} · ${esc(m.section)}</div>
      <div class="title">${esc(m.name)}</div>
      <div class="core">${esc(m.core)}</div>
      <div class="row"><span class="label">触发条件：</span>${esc(m.trigger)}</div>
      <div class="row"><span class="label">底层逻辑：</span>${esc(m.logic)}</div>
      <div class="row"><span class="label">行动指令：</span>${esc(m.action)}</div>
      <div class="row"><span class="label">边界 / 反例：</span>${esc(m.boundary)}</div>
      <div class="row related"><span class="label">关联模型：</span>${esc(m.related)}</div>
      ${m.case ? `<div class="row"><span class="label">现实案例：</span>${esc(m.case)}</div>` : ''}
    </article>
  `).join('');
}

q.addEventListener('input', render);
document.getElementById('clear').onclick = () => { q.value=''; activeSection='全部'; renderChips(); render(); };
renderChips();
render();
</script>
